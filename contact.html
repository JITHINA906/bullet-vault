<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BulletVault | Contact</title>

<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

.contact-container{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:30px;
    max-width:1100px;
    margin:50px auto;
    padding:20px;
}

.info,.form-box{
    background:#1E1E1E;
    padding:30px;
    border-radius:12px;
}

.info h2,
.form-box h2{
    color:#D4AF37;
    margin-bottom:20px;
}

.info p{
    margin:15px 0;
    color:#ddd;
}

.form-box input,
.form-box textarea{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:8px;
    background:#2A2A2A;
    color:white;
}

.form-box button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#D4AF37;
    color:#111;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.form-box button:hover{
    background:#f2c94c;
}

iframe{
    width:100%;
    height:250px;
    border:none;
    border-radius:10px;
    margin-top:20px;
}

@media(max-width:768px){

.contact-container{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<header>

<div class="logo">🏍 BulletVault</div>

<nav>

<a href="index.html">Home</a>
<a href="bikes.html">Bikes</a>
<a href="accessories.html">Accessories</a>
<a href="booking.html">Booking</a>
<a href="contact.html">Contact</a>

</nav>

</header>

<div class="contact-container">

<div class="info">

<h2>Contact Us</h2>

<p>📍 BulletVault Showroom</p>

<p>Mavoor Road, Kozhikode, Kerala</p>

<p>📞 +91 98765 43210</p>

<p>📧 info@bulletvault.com</p>

<p>🕒 Mon - Sat : 9:00 AM - 7:00 PM</p>

<iframe
src="https://www.google.com/maps?q=Kozhikode&output=embed">
</iframe>

</div>

<div class="form-box">

<h2>Send a Message</h2>

<form id="contactForm">

<input
type="text"
placeholder="Your Name"
required>

<input
type="email"
placeholder="Email Address"
required>

<textarea
rows="6"
placeholder="Write your message..."
required></textarea>

<button type="submit">

Send Message

</button>

</form>

</div>

</div>

<footer>

<p>© 2026 BulletVault</p>

</footer>

<script>

document.getElementById("contactForm").addEventListener("submit",function(e){

e.preventDefault();

alert("✅ Thank you for contacting BulletVault!\n\nOur team will reach out to you soon.");

this.reset();

});

</script>

</body>
</html>
